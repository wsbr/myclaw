        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [Sessions]
      operationId: deleteMemory
      parameters:
        - {$ref: '#/components/parameters/MemoryId'}
        - {$ref: '#/components/parameters/RawUserId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '204': {description: Memory tombstone committed; future recall stops immediately.}
        default: {$ref: '#/components/responses/Error'}

  /knowledge-bases:
    get:
      tags: [Knowledge]
      operationId: listKnowledgeBases
      parameters: [{$ref: '#/components/parameters/RawUserId'}]
      responses:
        '200': {description: Current account active knowledge bases., content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeBasePage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Knowledge]
      operationId: createKnowledgeBase
      parameters: [{$ref: '#/components/parameters/RawUserId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeBaseCreate'}}}
      responses:
        '201': {description: Tenant/account-owned knowledge base created., content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeBase'}}}}
        default: {$ref: '#/components/responses/Error'}

  /knowledge-bases/{knowledge_base_id}:
    parameters:
      - {$ref: '#/components/parameters/KnowledgeBaseId'}
      - {$ref: '#/components/parameters/RawUserId'}
    get:
      tags: [Knowledge]
      operationId: getKnowledgeBase
      responses:
        '200': {description: Owned knowledge base projection., content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeBase'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [Knowledge]
      operationId: deleteKnowledgeBase
      responses:
        '200': {description: Knowledge base and current documents tombstoned., content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}}
        default: {$ref: '#/components/responses/Error'}

  /knowledge-bases/{knowledge_base_id}/access:
    patch:
      tags: [Knowledge]
      operationId: replaceKnowledgeBaseAgentAccess
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/RawUserId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeAccessPatch'}}}
      responses:
        '200': {description: Exact Agent grant set replaced., content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeBase'}}}}
        default: {$ref: '#/components/responses/Error'}

  /knowledge-bases/embedding-models/available:
    get:
      tags: [Knowledge]
      operationId: listAvailableKnowledgeEmbeddingModels
      parameters: [{$ref: '#/components/parameters/RawUserId'}]
      responses:
        '200': {description: Activated Embedding models available to KnowledgeBase configuration., content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeEmbeddingModelPage'}}}}
        default: {$ref: '#/components/responses/Error'}

  /knowledge-bases/{knowledge_base_id}/embedding-model:
    patch:
      tags: [Knowledge]
      operationId: configureKnowledgeEmbeddingModel
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/RawUserId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeEmbeddingPatch'}}}
      responses:
        '200': {description: Embedding model selected and semantic reindex queued., content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeBase'}}}}
        default: {$ref: '#/components/responses/Error'}

  /knowledge-bases/{knowledge_base_id}/lexicon:
    parameters:
      - {$ref: '#/components/parameters/KnowledgeBaseId'}
      - {$ref: '#/components/parameters/RawUserId'}
    get:
      tags: [Knowledge]
      operationId: getKnowledgeLexicon
      responses:
        '200': {description: Current immutable domain lexicon revision., content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeLexiconRevision'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      tags: [Knowledge]
      operationId: replaceKnowledgeLexicon
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeLexiconReplace'}}}
      responses:
        '200': {description: Immutable lexicon revision selected and hybrid reindex queued., content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeLexiconRevision'}}}}
        default: {$ref: '#/components/responses/Error'}

  /knowledge-bases/{knowledge_base_id}/documents:
    get:
      tags: [Knowledge]
      operationId: listKnowledgeDocuments
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/RawUserId'}
      responses:
        '200': {description: Current active documents., content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeDocumentPage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Knowledge]
      operationId: uploadKnowledgeDocument
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/RawUserId'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties: {file: {type: string, format: binary}}
      responses:
        '201': {description: Source stored and an immutable local revision published or semantic revision queued., content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeIngestResult'}}}}
        default: {$ref: '#/components/responses/Error'}

  /knowledge-bases/{knowledge_base_id}/documents/{document_id}:
    delete:
      tags: [Knowledge]
      operationId: deleteKnowledgeDocument
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/KnowledgeDocumentId'}
        - {$ref: '#/components/parameters/RawUserId'}
      responses:
        '200': {description: Document tombstoned and a new retrieval revision selected., content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeDeleteResult'}}}}
        default: {$ref: '#/components/responses/Error'}

  /knowledge-bases/{knowledge_base_id}/reindex:
    post:
      tags: [Knowledge]
      operationId: reindexKnowledgeBase
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/RawUserId'}
      responses:
        '200': {description: Current immutable index revision., content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeIndexRevision'}}}}
        default: {$ref: '#/components/responses/Error'}

  /knowledge-bases/{knowledge_base_id}/reconcile-storage:
    post:
      tags: [Knowledge]
      operationId: reconcileKnowledgeBaseStorage
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/RawUserId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeReconcileRequest'}}}
      responses:
        '200': {description: Missing, corrupt and unreferenced local body report with optional fail-closed repair., content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeReconcileResult'}}}}
        default: {$ref: '#/components/responses/Error'}

  /knowledge-bases/{knowledge_base_id}/search:
    post:
      tags: [Knowledge]
      operationId: searchKnowledgeBase
      parameters:
        - {$ref: '#/components/parameters/KnowledgeBaseId'}
        - {$ref: '#/components/parameters/RawUserId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeSearchRequest'}}}
      responses:
        '200': {description: Bounded hybrid semantic retrieval with exact citations., content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgeSearchResponse'}}}}
        default: {$ref: '#/components/responses/Error'}

  /sessions/{session_id}/events:
    get:
      tags: [Events]
      operationId: listSessionEvents
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
        - {$ref: '#/components/parameters/RawUserId'}
        - {$ref: '#/components/parameters/AfterSequence'}
        - {$ref: '#/components/parameters/ScanLimit'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: Reliable authorized event scan., content: {application/json: {schema: {$ref: '#/components/schemas/EventScan'}}}}
        '410': {$ref: '#/components/responses/CursorExpired'}
        default: {$ref: '#/components/responses/Error'}

  /sessions/{session_id}/events/stream:
    get:
      tags: [Events]
      operationId: streamSessionEvents
      parameters:
        - {$ref: '#/components/parameters/SessionId'}
        - {$ref: '#/components/parameters/RawUserId'}
        - {$ref: '#/components/parameters/AfterSequence'}
        - {name: Last-Event-ID, in: header, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        '200':
          description: Reliable SSE stream. id is the scanned session sequence; cursor frames advance over invisible events.
          headers:
            Cache-Control: {schema: {type: string, const: no-cache}}
          content:
            text/event-stream:
              schema: {type: string}
        '410': {$ref: '#/components/responses/CursorExpired'}
        default: {$ref: '#/components/responses/Error'}

  /runs/{run_id}/events:
    get:
      tags: [Events]
      operationId: listRunEvents
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/RawUserId'}
        - {$ref: '#/components/parameters/AfterSequence'}
        - {$ref: '#/components/parameters/ScanLimit'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: Run-filtered scan using the parent Session sequence., content: {application/json: {schema: {$ref: '#/components/schemas/EventScan'}}}}
        '410': {$ref: '#/components/responses/CursorExpired'}
        default: {$ref: '#/components/responses/Error'}

  /health/live:
    get:
      tags: [Operations]
      operationId: getLiveness
      security: []
      responses:
        '200': {description: Process is alive., content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}}

  /health/ready:
    get:
      tags: [Operations]
      operationId: getReadiness
      security: []
      responses:
        '200': {description: Instance can serve its declared deployment profile., content: {application/json: {schema: {$ref: '#/components/schemas/DeploymentHealth'}}}}
        '503': {description: Required dependency or contract is not ready., content: {application/json: {schema: {$ref: '#/components/schemas/DeploymentHealth'}}}}

components:
  securitySchemes:
    webSession:
      type: apiKey
      in: cookie
      name: myclaw_session
      description: Opaque SameSite secure browser session resolved to an internal account_id; state-changing requests also follow x-cookie-auth-contract.
    enterpriseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Verified OIDC user, OBO, or service-principal token; available only under enterprise_oidc_v1.
    uatAgentApiKey:
      type: http
      scheme: bearer
      bearerFormat: MyClaw-Agent-Key
      description: Opaque Agent API key; available only under raw_user_id_v1 and valid only together with rawUserIdHeader.
    rawUserIdHeader:
      type: apiKey
      in: header
      name: X-MyClaw-User-Id
      description: Caller assertion paired with uatAgentApiKey; forbidden under enterprise_oidc_v1.

  parameters:
    AccountId: {name: account_id, in: path, required: true, schema: {type: string, format: uuid}}
    ExternalIdentityId: {name: external_identity_id, in: path, required: true, schema: {type: string, format: uuid}}
    AgentId: {name: agent_id, in: path, required: true, schema: {type: string, format: uuid}}
    AgentVersionId: {name: agent_version_id, in: path, required: true, schema: {type: string, format: uuid}}
    ScheduleId: {name: schedule_id, in: path, required: true, schema: {type: string, format: uuid}}
    ScheduleFireId: {name: fire_id, in: path, required: true, schema: {type: string, format: uuid}}
    ModelId: {name: model_id, in: path, required: true, schema: {type: string, format: uuid}}
    ModelVersionId: {name: model_version_id, in: path, required: true, schema: {type: string, format: uuid}}
    ToolId: {name: tool_id, in: path, required: true, schema: {type: string, format: uuid}}
    ConnectionId: {name: connection_id, in: path, required: true, schema: {type: string, format: uuid}}
    SkillId: {name: skill_id, in: path, required: true, schema: {type: string, format: uuid}}
    SkillVersionId: {name: skill_version_id, in: path, required: true, schema: {type: string, format: uuid}}
    ApiKeyId: {name: key_id, in: path, required: true, schema: {type: string, format: uuid}}
    SessionId: {name: session_id, in: path, required: true, schema: {type: string, format: uuid}}
    RunId: {name: run_id, in: path, required: true, schema: {type: string, format: uuid}}
    WorkItemId: {name: work_item_id, in: path, required: true, schema: {type: string, format: uuid}}
    RunnerId: {name: runner_id, in: path, required: true, schema: {type: string, format: uuid}}
    WorkingPlanId: {name: working_plan_id, in: path, required: true, schema: {type: string, format: uuid}}
    GroupId: {name: group_id, in: path, required: true, schema: {type: string, format: uuid}}
    GroupRunId: {name: group_run_id, in: path, required: true, schema: {type: string, format: uuid}}
    SharedTaskId: {name: shared_task_id, in: path, required: true, schema: {type: string, format: uuid}}
    ClarificationId: {name: clarification_id, in: path, required: true, schema: {type: string, format: uuid}}
    ApprovalId: {name: approval_id, in: path, required: true, schema: {type: string, format: uuid}}
    ArtifactId: {name: artifact_id, in: path, required: true, schema: {type: string, format: uuid}}
    MemoryId: {name: memory_id, in: path, required: true, schema: {type: string, format: uuid}}
    KnowledgeBaseId: {name: knowledge_base_id, in: path, required: true, schema: {type: string, format: uuid}}
    KnowledgeDocumentId: {name: document_id, in: path, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted optimistic version of the mutable aggregate named by the operation; child-version commands use the parent logical resource version.
      schema: {type: string, pattern: '^"[0-9]+"$'}
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for every state-changing request authenticated by webSession; ignored as an authentication factor for Bearer requests.
      x-required-when: webSession
      schema: {type: string, minLength: 32, maxLength: 256, pattern: '^[A-Za-z0-9._~-]+$'}
    RawUserId:
      name: X-MyClaw-User-Id
      in: header
      required: false
      description: Required only under raw_user_id_v1 and forbidden under every production profile.
      schema: {type: string, minLength: 1, maxLength: 191, pattern: '^[^\x00-\x1F\x7F]+$'}
    RequiredRawUserId:
      name: X-MyClaw-User-Id
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 191, pattern: '^[^\x00-\x1F\x7F]+$'}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 4096}}
    AfterSequence: {name: after_sequence, in: query, schema: {type: integer, format: int64, minimum: 0, default: 0}}
    ScanLimit: {name: scan_limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 500}}

  headers:
    ChecksumEtag:
      description: Quoted SHA-256 checksum of immutable artifact bytes.
      schema: {type: string, pattern: '^"[a-f0-9]{64}"$'}

  responses:
    Error:
      description: Stable structured error.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
    CursorExpired:
      description: Requested sequence is outside the retained reliable-event window.
      content: {application/json: {schema: {$ref: '#/components/schemas/CursorExpiredError'}}}

  schemas:
    Uuid: {type: string, format: uuid}
    Timestamp: {type: string, format: date-time}
    Sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
    AgentStatus: {type: string, enum: [draft, published, inactive]}
    AgentVisibility: {type: string, enum: [private, enterprise]}
    PermissionMode: {type: string, enum: [direct, plan_readonly]}
    RunMode: {type: string, enum: [chat, plan, group]}
    RunStatus: {type: string, enum: [active, waiting_user, waiting_approval, waiting_tool, waiting_agent, completed, cancelled, failed]}
    WaitReason: {type: [string, 'null'], enum: [waiting_user, waiting_approval, waiting_tool, waiting_agent, null]}
    Visibility: {type: string, enum: [private, direct, group, user]}
    WorkItemStatus: {type: string, enum: [queued, running, waiting_user, waiting_approval, waiting_tool, waiting_agent, waiting_resource, succeeded, failed, cancelled, timed_out, blocked]}
    RunnerStatus: {type: string, enum: [queued, running, succeeded, failed, cancelled, lost]}
    AgentSchedulePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        schedule_type: {type: string, enum: [once, cron, interval]}
        run_at: {type: [string, 'null'], format: date-time}
        cron_expression: {type: [string, 'null'], maxLength: 191}
        interval_seconds: {type: [integer, 'null'], minimum: 60, maximum: 31536000}
        timezone: {type: string, minLength: 1, maxLength: 100}
        end_at: {type: [string, 'null'], format: date-time}
        max_occurrences: {type: [integer, 'null'], minimum: 1}
        overlap_policy: {type: string, enum: [skip, queue_one, allow]}
        misfire_policy: {type: string, enum: [skip, fire_once]}
        misfire_grace_seconds: {type: integer, minimum: 0, maximum: 86400}
    AgentSchedule:
      type: object
      required: [id, agent_id, agent_name, name, prompt, context_mode, schedule_type, timezone, status, occurrence_count, total_fire_count, version, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        definition_tool_invocation_id: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        agent_id: {$ref: '#/components/schemas/Uuid'}
        agent_name: {type: string}
        name: {type: string}
        prompt: {type: string}
        context_mode: {type: string, enum: [new_session, continue_session]}
        source_session_id: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        schedule_type: {type: string, enum: [once, cron, interval]}
        run_at: {type: [string, 'null'], format: date-time}
        cron_expression: {type: [string, 'null']}
        interval_seconds: {type: [integer, 'null']}
        timezone: {type: string}
        next_fire_at: {type: [string, 'null'], format: date-time}
        next_fire_local: {type: [string, 'null']}
        end_at: {type: [string, 'null'], format: date-time}
        version_policy: {type: string, enum: [latest_published, pinned]}
        pinned_agent_version_id: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        overlap_policy: {type: string, enum: [skip, queue_one, allow]}
        misfire_policy: {type: string, enum: [skip, fire_once]}
        misfire_grace_seconds: {type: integer}
        status: {type: string, enum: [active, paused, completed, disabled]}
        max_occurrences: {type: [integer, 'null'], minimum: 1}
        occurrence_count: {type: integer, format: int64, minimum: 0}
        total_fire_count: {type: integer, format: int64, minimum: 0}
        last_scheduled_for: {type: [string, 'null'], format: date-time}
        last_fired_at: {type: [string, 'null'], format: date-time}
        last_error_code: {type: [string, 'null']}
        last_error_detail: {type: [string, 'null']}
        version: {type: integer, format: int64, minimum: 1}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    AgentScheduleFire:
      type: object
      required: [id, schedule_id, schedule_name, agent_id, agent_name, trigger_kind, context_mode, scheduled_for, scheduled_for_local, status, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        schedule_id: {$ref: '#/components/schemas/Uuid'}
        schedule_name: {type: string}
        agent_id: {$ref: '#/components/schemas/Uuid'}
        agent_name: {type: string}
        trigger_kind: {type: string, enum: [scheduled, manual]}
        definition_tool_invocation_id: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        definition_hash: {type: [string, 'null']}
        occurrence_no: {type: [integer, 'null'], minimum: 1}
        context_mode: {type: string, enum: [new_session, continue_session]}
        scheduled_for: {$ref: '#/components/schemas/Timestamp'}
        scheduled_for_local: {type: string}
        status: {type: string, enum: [queued, deferred, dispatching, running, succeeded, failed, skipped, cancelled]}
        reason_code: {type: [string, 'null']}
        agent_version_id: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        session_id: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        run_id: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        runner_id: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        result_preview: {type: [string, 'null']}
        fired_at: {type: [string, 'null'], format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        notification_read_at: {type: [string, 'null'], format: date-time}
        error_code: {type: [string, 'null']}
        error_detail: {type: [string, 'null']}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    RequiredActionType: {type: string, enum: [plan_implementation, tool, membership, session_grant, reporter_selection, clarification]}
    RequiredActionStatus: {type: string, enum: [pending, approved, rejected, answered, cancelled]}
    EventType:
      type: string
      enum:
        - run.created
        - run.waiting
        - run.resumed
        - run.cancellation_requested
        - run.completed
        - run.failed
        - run.cancelled
        - work_item.created
        - work_item.running
        - work_item.waiting_user
        - work_item.waiting_approval
        - work_item.waiting_tool
        - work_item.waiting_agent
        - work_item.waiting_resource
        - work_item.resumed
        - work_item.succeeded
        - work_item.failed
        - work_item.cancelled
        - work_item.timed_out
        - work_item.blocked
        - runner.created
        - runner.started
        - runner.succeeded
        - runner.failed
        - runner.cancelled
        - runner.lost
        - agent_turn.started
        - agent_turn.waiting_actions
        - agent_turn.completed
        - agent_turn.failed
        - message.created
        - tool_invocation.created
        - tool_invocation.waiting_confirmation
        - tool_invocation.waiting_resource
        - tool_invocation.queued
        - tool_invocation.running
        - tool_invocation.succeeded
        - tool_invocation.failed
        - tool_invocation.rejected
        - tool_invocation.cancelled
        - tool_invocation.outcome_unknown
        - agent_invocation.created
        - agent_invocation.queued
        - agent_invocation.running
        - agent_invocation.succeeded
        - agent_invocation.failed
        - agent_invocation.rejected
        - agent_invocation.cancelled
        - agent_invocation.timed_out
        - clarification.requested
        - clarification.answered
        - clarification.cancelled
        - approval.requested
        - approval.approved
        - approval.rejected
        - approval.cancelled
        - plan.permission_entered
        - plan.permission_exited
        - plan.implementation_approved
        - working_plan.updated
        - group.created
        - group.membership_joined
        - group.membership_ended
        - group.membership_invitation_rejected
        - group.message_created
        - group.summary_requested
        - group.summary_delivered
        - shared_task.updated
        - artifact.published
        - artifact.unavailable
        - artifact.restored
        - artifact.deleted
        - notification_delivery.created
        - notification_delivery.succeeded
        - notification_delivery.failed
        - notification_delivery.dead
        - notification_delivery.outcome_unknown
        - verification.completed
        - budget.warning
        - late_result.observed
    JsonObject: {type: object, additionalProperties: true}
    LinkMap: {type: object, additionalProperties: {type: string}}

    AuthContextView:
      type: object
      additionalProperties: false
      required: [tenant_id, account_id, account_type, canonical_user_id, authentication_source, identity_profile, external_identity_id, api_key_id, asserted_user_id, entry_agent_id, client_id, roles, scopes, credential_revision, account_authorization_revision, request_id]
      properties:
        tenant_id: {$ref: '#/components/schemas/Uuid'}
        account_id: {$ref: '#/components/schemas/Uuid'}
        account_type: {type: string, enum: [user, service]}
        canonical_user_id: {type: string, maxLength: 191}
        authentication_source: {type: string, enum: [web_session, agent_api_key, oidc_user, oidc_obo, service_principal]}
        identity_profile: {type: string, enum: [raw_user_id_v1, enterprise_oidc_v1]}
        external_identity_id: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        api_key_id: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        asserted_user_id: {type: [string, 'null'], maxLength: 191}
        entry_agent_id: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        client_id: {type: [string, 'null'], maxLength: 255}
        roles: {type: array, uniqueItems: true, items: {type: string, enum: [user, builder, admin]}}
        scopes: {type: array, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 191}}
        credential_revision: {type: integer, format: int64, minimum: 1}
        account_authorization_revision: {type: integer, format: int64, minimum: 1}
        request_id: {$ref: '#/components/schemas/Uuid'}
      allOf:
        - if: {properties: {identity_profile: {const: raw_user_id_v1}}, required: [identity_profile]}
          then:
            properties:
              authentication_source: {enum: [web_session, agent_api_key]}
              external_identity_id: {type: 'null'}
        - if: {properties: {identity_profile: {const: enterprise_oidc_v1}}, required: [identity_profile]}
          then:
            properties:
              authentication_source: {enum: [oidc_user, oidc_obo, service_principal]}
              external_identity_id: {$ref: '#/components/schemas/Uuid'}
              api_key_id: {type: 'null'}
              asserted_user_id: {type: 'null'}
              entry_agent_id: {type: 'null'}
        - if: {properties: {authentication_source: {const: agent_api_key}}, required: [authentication_source]}
          then:
            properties:
              account_type: {const: user}
              api_key_id: {$ref: '#/components/schemas/Uuid'}
              asserted_user_id: {type: string, minLength: 1, maxLength: 191}
              entry_agent_id: {$ref: '#/components/schemas/Uuid'}
              client_id: {type: 'null'}
        - if: {properties: {authentication_source: {const: web_session}}, required: [authentication_source]}
          then:
            properties:
              account_type: {const: user}
              api_key_id: {type: 'null'}
              asserted_user_id: {type: 'null'}
              entry_agent_id: {type: 'null'}
              client_id: {type: 'null'}
        - if: {properties: {authentication_source: {const: service_principal}}, required: [authentication_source]}
          then: {properties: {account_type: {const: service}, client_id: {type: string, minLength: 1, maxLength: 255}, roles: {type: array, maxItems: 0}}}
        - if: {properties: {authentication_source: {enum: [oidc_user, oidc_obo]}}, required: [authentication_source]}
          then: {properties: {account_type: {const: user}, client_id: {type: string, minLength: 1, maxLength: 255}}}

