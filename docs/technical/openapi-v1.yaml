              checksum: {$ref: '#/components/schemas/Sha256'}
              availability_reason: {type: 'null'}
              published_at: {$ref: '#/components/schemas/Timestamp'}
              deletion_requested_at: {type: 'null'}
              deleted_at: {type: 'null'}
