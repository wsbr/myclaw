openapi: 3.1.0
info:
  title: MyClaw Agent-native API
  version: 1.0.0
  description: |
    MyClaw v1 external resource and command contract. MySQL domain state is authoritative.
    Stateful commands require Idempotency-Key; mutable resources additionally require If-Match.
    Deployments declare exactly one identity_profile. raw_user_id_v1 requires
    X-MyClaw-User-Id whenever uatAgentApiKey is used and is limited to dev/UAT. The production profile
    enterprise_oidc_v1 forbids that header and resolves account_id exclusively
    from verified user, OBO or service-principal tokens.
  x-contract-authority:
    database: ./database-schema.md
    state_machines: ./state-machines.md
    prose_protocol: ./api-sse.md
    production_profile: ./production-reference-architecture.md
  x-cookie-auth-contract:
    authorization_flow: authorization_code_pkce_s256
    mutation_csrf_header: X-CSRF-Token
    mutation_origin_check: required
    applies_when: webSession authenticates POST, PUT, PATCH, or DELETE
servers:
  - url: /api/v1
security:
  - webSession: []
  - enterpriseBearer: []
  - uatAgentApiKey: []
    rawUserIdHeader: []
tags:
  - name: Identity
  - name: Accounts
  - name: Agents
  - name: Registry
  - name: Sessions
  - name: Schedules
  - name: Runs
  - name: Plans
  - name: Network
  - name: Groups
  - name: Actions
  - name: Artifacts
  - name: Knowledge
  - name: Events
  - name: Operations

paths:
  /auth/me:
    get:
      tags: [Identity]
      operationId: getAuthContext
      responses:
        '200':
          description: Authenticated principal projection.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthContextView'}
        default: {$ref: '#/components/responses/Error'}

  /auth/enterprise/start:
    get:
      tags: [Identity]
      operationId: startEnterpriseLogin
      security: []
      parameters:
        - name: return_to
          in: query
          schema: {type: string, maxLength: 2048}
      responses:
        '302': {description: Redirect to the configured enterprise IdP.}
        default: {$ref: '#/components/responses/Error'}

  /auth/enterprise/callback:
    get:
      tags: [Identity]
      operationId: completeEnterpriseLogin
      security: []
      parameters:
        - {name: code, in: query, required: true, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
      responses:
        '302': {description: Login completed and browser redirected.}
        default: {$ref: '#/components/responses/Error'}

  /auth/logout:
    post:
      tags: [Identity]
      operationId: logoutBrowserSession
      description: Revokes the current browser session. X-CSRF-Token is required when webSession authenticates the request.
      security:
        - webSession: []
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '204': {description: Session revoked and cookie cleared.}
        default: {$ref: '#/components/responses/Error'}

  /accounts/me:
    get:
      tags: [Accounts]
      operationId: getMyAccount
      responses:
        '200':
          description: Current platform account.
          content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [Accounts]
      operationId: updateMyAccount
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/RawUserId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AccountPatch'}}}
      responses:
        '200':
          description: Updated account.
          content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}
        default: {$ref: '#/components/responses/Error'}

  /identity/preprovision:
    post:
      tags: [Identity]
      operationId: preprovisionRawUserAccount
      description: Available only under raw_user_id_v1; creates or returns a normal user account.
      x-identity-profiles: [raw_user_id_v1]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/RequiredRawUserId'}
      responses:
        '200':
          description: Existing account.
          content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}
        '201':
          description: Created account.
          content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}
        default: {$ref: '#/components/responses/Error'}

  /admin/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Account page.
          content: {application/json: {schema: {$ref: '#/components/schemas/AccountPage'}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Accounts]
      operationId: createAccount
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AccountCreate'}}}
      responses:
        '201':
          description: Created account; user accounts receive the base user role, service accounts receive no human role and are authorized only by workload scopes.
          content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}
        default: {$ref: '#/components/responses/Error'}

  /admin/accounts/{account_id}/roles:
    patch:
      tags: [Accounts]
      operationId: replaceAccountRoles
      parameters:
        - {$ref: '#/components/parameters/AccountId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RolesPatch'}}}
      responses:
        '200':
          description: Updated account.
          content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}
        default: {$ref: '#/components/responses/Error'}

  /admin/accounts/{account_id}/status:
    patch:
      tags: [Accounts]
      operationId: updateAccountStatus
      parameters:
        - {$ref: '#/components/parameters/AccountId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AccountStatusPatch'}}}
      responses:
        '200':
          description: Updated account.
          content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}
        default: {$ref: '#/components/responses/Error'}

  /admin/runtime/summary:
    get:
      tags: [Operations]
      operationId: getRuntimeConsoleSummary
      description: Administrator-only redacted projection of global Runtime, queue, process-heartbeat and lease health.
      responses:
        '200': {description: Runtime health snapshot., content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeConsoleSummary'}}}}
        default: {$ref: '#/components/responses/Error'}

  /admin/runtime/runs:
    get:
      tags: [Operations]
      operationId: listRuntimeConsoleRuns
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: mode, in: query, schema: {type: string, enum: [chat, plan, group]}}
        - {name: account_id, in: query, schema: {$ref: '#/components/schemas/Uuid'}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: Redacted global Run page., content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeRunPage'}}}}
        default: {$ref: '#/components/responses/Error'}

  /admin/runtime/runs/{run_id}:
    get:
      tags: [Operations]
      operationId: getRuntimeConsoleRun
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200': {description: Redacted operational Run detail., content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeRunDetail'}}}}
        default: {$ref: '#/components/responses/Error'}

  /admin/runtime/outbox:
    get:
      tags: [Operations]
      operationId: listRuntimeConsoleOutbox
      parameters:
        - {name: topic, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [pending, claimed, retry_wait, completed, dead]}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: Redacted Outbox command page without payload or raw errors., content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeOutboxPage'}}}}
        default: {$ref: '#/components/responses/Error'}

  /admin/usage/prices:
    get:
      tags: [Operations]
      operationId: listUsagePriceSnapshots
      description: Administrator-only immutable price snapshots; overlapping effective windows are rejected.
      responses:
        '200': {description: Price snapshot page., content: {application/json: {schema: {$ref: '#/components/schemas/UsagePricePage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Operations]
      operationId: createUsagePriceSnapshot
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UsagePriceCreate'}}}
      responses:
        '201': {description: Immutable effective-dated price snapshot., content: {application/json: {schema: {$ref: '#/components/schemas/UsagePriceSnapshot'}}}}
        default: {$ref: '#/components/responses/Error'}

  /admin/usage/entries:
    get:
      tags: [Operations]
      operationId: listUsageLedgerEntries
      parameters:
        - {name: run_id, in: query, schema: {$ref: '#/components/schemas/Uuid'}}
        - {name: account_id, in: query, schema: {$ref: '#/components/schemas/Uuid'}}
        - {name: agent_version_id, in: query, schema: {$ref: '#/components/schemas/Uuid'}}
        - {name: model_version_id, in: query, schema: {$ref: '#/components/schemas/Uuid'}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: Append-only usage entry page., content: {application/json: {schema: {$ref: '#/components/schemas/UsageEntryPage'}}}}
        default: {$ref: '#/components/responses/Error'}

  /admin/usage/rollups:
    get:
      tags: [Operations]
      operationId: getUsageRollups
      parameters:
        - {name: group_by, in: query, schema: {type: string, enum: [run_id, account_id, group_run_id, agent_version_id, model_version_id], default: run_id}}
        - {name: run_id, in: query, schema: {$ref: '#/components/schemas/Uuid'}}
        - {name: account_id, in: query, schema: {$ref: '#/components/schemas/Uuid'}}
        - {name: agent_version_id, in: query, schema: {$ref: '#/components/schemas/Uuid'}}
        - {name: model_version_id, in: query, schema: {$ref: '#/components/schemas/Uuid'}}
      responses:
        '200': {description: Reconciled quantities and known/unknown cost partitions., content: {application/json: {schema: {$ref: '#/components/schemas/UsageRollupPage'}}}}
        default: {$ref: '#/components/responses/Error'}

  /admin/usage/adjustments:
    post:
      tags: [Operations]
      operationId: createUsageAdjustment
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UsageAdjustmentCreate'}}}
      responses:
        '201': {description: Append-only positive or negative correction., content: {application/json: {schema: {$ref: '#/components/schemas/UsageLedgerEntry'}}}}
        default: {$ref: '#/components/responses/Error'}

  /runs/{run_id}/usage:
    get:
      tags: [Runs]
      operationId: getOwnedRunUsage
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - {$ref: '#/components/parameters/RawUserId'}
      responses:
        '200': {description: Owned Run usage entries and exact rollup., content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        default: {$ref: '#/components/responses/Error'}

  /admin/accounts/{account_id}/external-identities:
    get:
      tags: [Accounts, Identity]
      operationId: listExternalIdentities
      x-identity-profiles: [enterprise_oidc_v1]
      parameters:
        - {$ref: '#/components/parameters/AccountId'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: External identity page., content: {application/json: {schema: {$ref: '#/components/schemas/ExternalIdentityPage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Accounts, Identity]
      operationId: bindExternalIdentity
      x-identity-profiles: [enterprise_oidc_v1]
      parameters:
        - {$ref: '#/components/parameters/AccountId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ExternalIdentityCreate'}}}
      responses:
        '201': {description: Verified issuer/subject binding created., content: {application/json: {schema: {$ref: '#/components/schemas/ExternalIdentity'}}}}
        default: {$ref: '#/components/responses/Error'}

  /admin/accounts/{account_id}/external-identities/{external_identity_id}:
    delete:
      tags: [Accounts, Identity]
      operationId: revokeExternalIdentity
      x-identity-profiles: [enterprise_oidc_v1]
      parameters:
        - {$ref: '#/components/parameters/AccountId'}
        - {$ref: '#/components/parameters/ExternalIdentityId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '204': {description: External identity binding revoked.}
        default: {$ref: '#/components/responses/Error'}

  /agents:
    get:
      tags: [Agents]
      operationId: listAgents
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/AgentStatus'}}
        - {name: visibility, in: query, schema: {$ref: '#/components/schemas/AgentVisibility'}}
        - {name: owner, in: query, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Agent page.
          content: {application/json: {schema: {$ref: '#/components/schemas/AgentPage'}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Agents]
      operationId: createAgent
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AgentCreate'}}}
      responses:
        '201':
          description: Created Agent with editable draft.
          content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}
        default: {$ref: '#/components/responses/Error'}

  /agents/{agent_id}:
    get:
      tags: [Agents]
      operationId: getAgent
      parameters: [{$ref: '#/components/parameters/AgentId'}]
      responses:
        '200':
          description: Agent.
          content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}
        default: {$ref: '#/components/responses/Error'}

  /agents/{agent_id}/members:
    get:
      tags: [Agents]
      operationId: listAgentMembers
      parameters: [{$ref: '#/components/parameters/AgentId'}]
      responses:
        '200':
          description: Active private-Agent grants and eligible Tenant member candidates. Owner/admin only.
          content: {application/json: {schema: {$ref: '#/components/schemas/AgentMembers'}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      tags: [Agents]
      operationId: replaceAgentMembers
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AgentMemberReplaceRequest'}}}
      responses:
        '200':
          description: Entire private-Agent use whitelist replaced atomically.
          content: {application/json: {schema: {$ref: '#/components/schemas/AgentMembers'}}}
        default: {$ref: '#/components/responses/Error'}

  /agents/{agent_id}/people:
    get:
      tags: [Agents]
      operationId: listAgentContactablePeople
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {name: query, in: query, schema: {type: string, maxLength: 200}}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Active same-Tenant people the current account may contact through this Agent.
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AgentPerson'}}}}
        default: {$ref: '#/components/responses/Error'}

  /agents/{agent_id}/draft:
    get:
      tags: [Agents]
      operationId: getAgentDraft
      parameters: [{$ref: '#/components/parameters/AgentId'}]
      responses:
        '200':
          description: Editable draft and resolved dependency preview.
          content: {application/json: {schema: {$ref: '#/components/schemas/AgentDraft'}}}
        default: {$ref: '#/components/responses/Error'}
    patch:
      tags: [Agents]
      operationId: updateAgentDraft
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AgentDraftPatch'}}}
      responses:
        '200':
          description: Updated draft.
          content: {application/json: {schema: {$ref: '#/components/schemas/AgentDraft'}}}
        default: {$ref: '#/components/responses/Error'}

  /agents/{agent_id}/publish:
    post:
      tags: [Agents]
      operationId: publishAgent
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PublishAgentRequest'}}}
      responses:
        '201':
          description: Immutable published version.
          content: {application/json: {schema: {$ref: '#/components/schemas/PublishedAgentVersionEnvelope'}}}
        default: {$ref: '#/components/responses/Error'}

  /agents/{agent_id}/deactivate:
    post:
      tags: [Agents]
      operationId: deactivateAgent
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {description: Agent deactivated., content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}}
        default: {$ref: '#/components/responses/Error'}

  /agents/{agent_id}/reactivate:
    post:
      tags: [Agents]
      operationId: reactivateAgent
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {description: Agent reactivated., content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}}
        default: {$ref: '#/components/responses/Error'}

  /agents/{agent_id}/versions:
    get:
      tags: [Agents]
      operationId: listAgentVersions
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: Version page., content: {application/json: {schema: {$ref: '#/components/schemas/AgentVersionPage'}}}}
        default: {$ref: '#/components/responses/Error'}

  /agents/{agent_id}/versions/{agent_version_id}:
    get:
      tags: [Agents]
      operationId: getAgentVersion
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {$ref: '#/components/parameters/AgentVersionId'}
      responses:
        '200': {description: Immutable version., content: {application/json: {schema: {$ref: '#/components/schemas/AgentVersion'}}}}
        default: {$ref: '#/components/responses/Error'}

  /agents/{agent_id}/draft/test-runs:
    post:
      tags: [Agents]
      operationId: createDraftTestRun
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DraftTestRunRequest'}}}
      responses:
        '202': {description: Draft snapshot and private test Run created., content: {application/json: {schema: {$ref: '#/components/schemas/RunEnvelope'}}}}
        default: {$ref: '#/components/responses/Error'}

  /agents/{agent_id}/eval-suites:
    get:
      tags: [Agents]
      operationId: listAgentEvalSuites
      parameters: [{$ref: '#/components/parameters/AgentId'}]
      responses:
        '200': {description: Current version of every release-gate suite., content: {application/json: {schema: {$ref: '#/components/schemas/AgentEvalSuitePage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Agents]
      operationId: createAgentEvalSuite
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentEvalSuiteDefinition'}}}}
      responses:
        '201': {description: Immutable evaluation suite version created and activated., content: {application/json: {schema: {$ref: '#/components/schemas/AgentEvalSuite'}}}}
        default: {$ref: '#/components/responses/Error'}

  /agents/{agent_id}/eval-suites/{suite_id}/versions:
    post:
      tags: [Agents]
      operationId: versionAgentEvalSuite
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {name: suite_id, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentEvalSuiteDefinition'}}}}
      responses:
        '200': {description: New immutable current suite version., content: {application/json: {schema: {$ref: '#/components/schemas/AgentEvalSuite'}}}}
        default: {$ref: '#/components/responses/Error'}

  /agents/{agent_id}/eval-suites/{suite_id}/state/{target}:
    post:
      tags: [Agents]
      operationId: changeAgentEvalSuiteState
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {name: suite_id, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - {name: target, in: path, required: true, schema: {type: string, enum: [activate, deactivate]}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {description: Updated logical suite state., content: {application/json: {schema: {$ref: '#/components/schemas/AgentEvalSuite'}}}}
        default: {$ref: '#/components/responses/Error'}

  /agents/{agent_id}/eval-suites/{suite_id}/runs:
    post:
      tags: [Agents]
      operationId: startAgentEvalRun
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {name: suite_id, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AgentEvalRunCreate'}}}}
      responses:
        '202': {description: Exact candidate frozen and one real runtime Run queued per case., content: {application/json: {schema: {$ref: '#/components/schemas/AgentEvalRun'}}}}
        default: {$ref: '#/components/responses/Error'}

  /agents/{agent_id}/eval-runs:
    get:
      tags: [Agents]
      operationId: listAgentEvalRuns
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: Recent evaluation runs with case settlements., content: {application/json: {schema: {$ref: '#/components/schemas/AgentEvalRunPage'}}}}
        default: {$ref: '#/components/responses/Error'}

  /agents/{agent_id}/eval-runs/{eval_run_id}:
    get:
      tags: [Agents]
      operationId: getAgentEvalRun
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {name: eval_run_id, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
      responses:
        '200': {description: Evaluation aggregate and assertion evidence., content: {application/json: {schema: {$ref: '#/components/schemas/AgentEvalRun'}}}}
        default: {$ref: '#/components/responses/Error'}

  /agents/{agent_id}/api-keys:
    get:
      tags: [Identity]
      operationId: listAgentApiKeys
      x-identity-profiles: [raw_user_id_v1]
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: API key metadata page., content: {application/json: {schema: {$ref: '#/components/schemas/ApiKeyPage'}}}}
        default: {$ref: '#/components/responses/Error'}
