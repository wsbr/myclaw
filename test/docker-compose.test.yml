# Test infrastructure — isolated ports from dev stack
#   MySQL 3307 | Redis 6380 | API 8001 | Frontend 8081
#
# Quick start (infra only):
#   docker compose -f docker-compose.test.yml up -d mysql-test redis-test
#
# Full stack deployment tests:
#   docker compose -f docker-compose.test.yml --profile fullstack up -d --build

x-backend-security: &backend-security
  user: "10001:10001"
  init: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  mysql-test:
    image: mysql:8.0
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-myclaw_test}
      MYSQL_USER: ${MYSQL_USER:-myclaw}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mypassword}
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "myclaw", "-pmypassword"]
      interval: 5s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/mysql
    networks:
      - default
      - sandbox-internal

  redis-test:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector-test:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/otel-collector.test.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4319:4318"
      - "13134:13133"
    profiles:
      - fullstack
    networks:
      - default
      - sandbox-internal

  api-test:
    <<: *backend-security
    build:
      context: ../backend
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${MYCLAW_ACCEPTANCE_COMMIT_SHA:-unbound}
    command: >
      sh -c '
        for attempt in $$(seq 1 30); do
          if alembic upgrade head; then
            exec uvicorn app.main:app --host 0.0.0.0 --port 8000;
          fi;
          echo "Migration attempt $$attempt failed; retrying in 2 seconds" >&2;
          sleep 2;
        done;
        echo "Database migrations failed after 30 attempts" >&2;
        exit 1
      '
    ports:
      - "8001:8000"
    env_file: .env.test
    environment:
      DATABASE_URL: mysql+aiomysql://myclaw:mypassword@mysql-test:3306/myclaw_test
      REDIS_URL: redis://:redispassword@redis-test:6379/0
      CORS_ORIGINS: '["${MYCLAW_FULLSTACK_UI_URL:-http://localhost:8081}","${MYCLAW_FULLSTACK_API_URL:-http://localhost:8001}"]'
      TRUSTED_SYNTHETIC_DNS_CIDRS: '${TRUSTED_SYNTHETIC_DNS_CIDRS:-["198.18.0.0/15"]}'
      INIT_ADMIN_EMAIL: admin@test.myclaw.local
      INIT_ADMIN_PASSWORD: testpassword123
      OTEL_SERVICE_NAME: myclaw-api-test
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-test:4318
    depends_on:
      mysql-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    profiles:
      - fullstack
    volumes:
      - myclaw-test-data:/var/lib/myclaw

  runtime-worker-test:
    <<: *backend-security
    build:
      context: ../backend
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${MYCLAW_ACCEPTANCE_COMMIT_SHA:-unbound}
    command: python -m app.workers.runtime_worker
    env_file: .env.test
    environment:
      DATABASE_URL: mysql+aiomysql://myclaw:mypassword@mysql-test:3306/myclaw_test
      REDIS_URL: redis://:redispassword@redis-test:6379/0
      RUNTIME_WORKER_POLL_SECONDS: "0.1"
      RUNTIME_OUTBOX_CLAIM_LEASE_SECONDS: "5"
      RUNTIME_RUNNER_LEASE_SECONDS: "8"
      RUNTIME_RUNNER_HEARTBEAT_SECONDS: "2"
      OTEL_SERVICE_NAME: myclaw-runtime-worker-test
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-test:4318
    depends_on:
      api-test:
        condition: service_healthy
    profiles:
      - fullstack
    volumes:
      - myclaw-test-data:/var/lib/myclaw

  sandbox-worker-test:
    <<: *backend-security
    build:
      context: ../backend
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${MYCLAW_ACCEPTANCE_COMMIT_SHA:-unbound}
    command: python -m app.workers.sandbox_worker
    env_file: .env.test
    environment:
      DATABASE_URL: mysql+aiomysql://myclaw:mypassword@mysql-test:3306/myclaw_test
      REDIS_URL: redis://:redispassword@redis-test:6379/0
      SANDBOX_WORKER_POLL_SECONDS: "0.1"
      SANDBOX_OUTBOX_CLAIM_LEASE_SECONDS: "5"
      SANDBOX_ATTEMPT_STALE_SECONDS: "10"
      SANDBOX_ATTEMPT_LEASE_SECONDS: "8"
      SANDBOX_ATTEMPT_HEARTBEAT_SECONDS: "2"
      OTEL_SERVICE_NAME: myclaw-sandbox-worker-test
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-test:4318
    depends_on:
      api-test:
        condition: service_healthy
    profiles:
      - fullstack
    volumes:
      - myclaw-test-data:/var/lib/myclaw
    networks:
      - sandbox-internal

  connector-worker-test:
    <<: *backend-security
    build:
      context: ../backend
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${MYCLAW_ACCEPTANCE_COMMIT_SHA:-unbound}
    command: python -m app.workers.connector_worker
    env_file: .env.test
    environment:
      DATABASE_URL: mysql+aiomysql://myclaw:mypassword@mysql-test:3306/myclaw_test
      REDIS_URL: redis://:redispassword@redis-test:6379/0
      SANDBOX_WORKER_POLL_SECONDS: "0.1"
      SANDBOX_OUTBOX_CLAIM_LEASE_SECONDS: "5"
      SANDBOX_ATTEMPT_STALE_SECONDS: "10"
      OTEL_SERVICE_NAME: myclaw-connector-worker-test
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-test:4318
    depends_on:
      api-test:
        condition: service_healthy
    profiles:
      - fullstack
    volumes:
      - myclaw-test-data:/var/lib/myclaw

  browser-worker-test:
    <<: *backend-security
    build:
      context: ../backend
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${MYCLAW_ACCEPTANCE_COMMIT_SHA:-unbound}
    command: python -m app.workers.browser_worker
    env_file: .env.test
    environment:
      DATABASE_URL: mysql+aiomysql://myclaw:mypassword@mysql-test:3306/myclaw_test
      REDIS_URL: redis://:redispassword@redis-test:6379/0
      SANDBOX_WORKER_POLL_SECONDS: "0.1"
      SANDBOX_OUTBOX_CLAIM_LEASE_SECONDS: "5"
      SANDBOX_ATTEMPT_STALE_SECONDS: "10"
      SANDBOX_ATTEMPT_LEASE_SECONDS: "8"
      SANDBOX_ATTEMPT_HEARTBEAT_SECONDS: "2"
      OTEL_SERVICE_NAME: myclaw-browser-worker-test
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-test:4318
    depends_on:
      api-test:
        condition: service_healthy
    profiles:
      - fullstack
    volumes:
      - myclaw-test-data:/var/lib/myclaw

  skill-sync-worker-test:
    <<: *backend-security
    build:
      context: ../backend
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${MYCLAW_ACCEPTANCE_COMMIT_SHA:-unbound}
    command: python -m app.workers.skill_sync_worker
    env_file: .env.test
    environment:
      DATABASE_URL: mysql+aiomysql://myclaw:mypassword@mysql-test:3306/myclaw_test
      REDIS_URL: redis://:redispassword@redis-test:6379/0
      SKILL_SYNC_WORKER_POLL_SECONDS: "0.1"
      SKILL_SYNC_CLAIM_LEASE_SECONDS: "5"
      OTEL_SERVICE_NAME: myclaw-skill-sync-worker-test
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-test:4318
    depends_on:
      api-test:
        condition: service_healthy
    profiles:
      - fullstack
    volumes:
      - myclaw-test-data:/var/lib/myclaw

  maintenance-worker-test:
    <<: *backend-security
    build:
      context: ../backend
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${MYCLAW_ACCEPTANCE_COMMIT_SHA:-unbound}
    command: python -m app.workers.maintenance_worker
    env_file: .env.test
    environment:
      DATABASE_URL: mysql+aiomysql://myclaw:mypassword@mysql-test:3306/myclaw_test
      REDIS_URL: redis://:redispassword@redis-test:6379/0
      MAINTENANCE_POLL_SECONDS: "3600"
      MAINTENANCE_COMMAND_POLL_SECONDS: "0.1"
      MAINTENANCE_COMMAND_CLAIM_LEASE_SECONDS: "30"
      MAINTENANCE_COMMAND_HEARTBEAT_SECONDS: "5"
      OTEL_SERVICE_NAME: myclaw-maintenance-worker-test
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-test:4318
    depends_on:
      api-test:
        condition: service_healthy
    profiles:
      - fullstack
    volumes:
      - myclaw-test-data:/var/lib/myclaw

  frontend-test:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${MYCLAW_ACCEPTANCE_COMMIT_SHA:-unbound}
      args:
        VITE_API_BASE_URL: ${MYCLAW_FULLSTACK_API_URL:-http://localhost:8001}
    ports:
      - "8081:80"
    depends_on:
      api-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    profiles:
      - fullstack

volumes:
  myclaw-test-data:

networks:
  sandbox-internal:
    internal: true
