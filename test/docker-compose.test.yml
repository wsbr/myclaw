# Test infrastructure — isolated ports from dev stack
#   MySQL 3307 | Redis 6380 | API 8001 | Frontend 8081 | Mock LLM 9090
#
# Quick start (infra only):
#   docker compose -f docker-compose.test.yml up -d mysql-test redis-test
#
# Full stack deployment tests:
#   docker compose -f docker-compose.test.yml --profile fullstack up -d --build

services:
  mysql-test:
    image: mysql:8.0
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-myclaw_test}
      MYSQL_USER: ${MYSQL_USER:-myclaw}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mypassword}
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "myclaw", "-pmypassword"]
      interval: 5s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/mysql

  redis-test:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-llm:
    build:
      context: .
      dockerfile: docker/Dockerfile.mock-llm
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles:
      - fullstack

  otel-collector-test:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/otel-collector.test.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4319:4318"
      - "13134:13133"
    profiles:
      - fullstack

  api-test:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8001:8000"
    env_file: .env.test
    environment:
      DATABASE_URL: mysql+aiomysql://myclaw:mypassword@mysql-test:3306/myclaw_test
      REDIS_URL: redis://:redispassword@redis-test:6379/0
      CORS_ORIGINS: '["${MYCLAW_FULLSTACK_UI_URL:-http://localhost:8081}","${MYCLAW_FULLSTACK_API_URL:-http://localhost:8001}"]'
      INIT_ADMIN_EMAIL: admin@test.myclaw.local
      INIT_ADMIN_PASSWORD: testpassword123
      MYCLAW_REAL_LLM_API_KEY: ${MYCLAW_REAL_LLM_API_KEY:-}
      OTEL_SERVICE_NAME: myclaw-api-test
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-test:4318
    depends_on:
      mysql-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      mock-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    profiles:
      - fullstack
    volumes:
      - myclaw-test-data:/var/lib/myclaw

  runtime-worker-test:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: python -m app.workers.runtime_worker
    env_file: .env.test
    environment:
      DATABASE_URL: mysql+aiomysql://myclaw:mypassword@mysql-test:3306/myclaw_test
      REDIS_URL: redis://:redispassword@redis-test:6379/0
      MYCLAW_REAL_LLM_API_KEY: ${MYCLAW_REAL_LLM_API_KEY:-}
      RUNTIME_WORKER_POLL_SECONDS: "0.1"
      RUNTIME_OUTBOX_CLAIM_LEASE_SECONDS: "5"
      RUNTIME_RUNNER_LEASE_SECONDS: "8"
      RUNTIME_RUNNER_HEARTBEAT_SECONDS: "2"
      OTEL_SERVICE_NAME: myclaw-runtime-worker-test
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-test:4318
    depends_on:
      api-test:
        condition: service_healthy
    profiles:
      - fullstack
    volumes:
      - myclaw-test-data:/var/lib/myclaw

  sandbox-worker-test:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: python -m app.workers.sandbox_worker
    env_file: .env.test
    environment:
      DATABASE_URL: mysql+aiomysql://myclaw:mypassword@mysql-test:3306/myclaw_test
      REDIS_URL: redis://:redispassword@redis-test:6379/0
      SANDBOX_WORKER_POLL_SECONDS: "0.1"
      SANDBOX_OUTBOX_CLAIM_LEASE_SECONDS: "5"
      SANDBOX_ATTEMPT_STALE_SECONDS: "10"
      OTEL_SERVICE_NAME: myclaw-sandbox-worker-test
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector-test:4318
    depends_on:
      api-test:
        condition: service_healthy
    profiles:
      - fullstack
    volumes:
      - myclaw-test-data:/var/lib/myclaw

  frontend-test:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${MYCLAW_FULLSTACK_API_URL:-http://localhost:8001}
    ports:
      - "8081:80"
    depends_on:
      api-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    profiles:
      - fullstack

volumes:
  myclaw-test-data:
