[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = unit e2e
pythonpath = . ../backend
markers =
    unit: Pure unit tests, no external services
    fullstack: Real Docker deployment tests (api + worker + frontend)
filterwarnings =
    ignore::DeprecationWarning
timeout = 300
minversion = 8.0
