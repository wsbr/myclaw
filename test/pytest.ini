[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = unit integration e2e
pythonpath = . ../backend
markers =
    unit: Pure unit tests, no external services
    integration: API + DB tests with mocked LLM (in-process)
    e2e: In-process E2E with trace validation
    fullstack: Real Docker deployment tests (api + worker + frontend)
    docker: Alias for fullstack (deprecated, use fullstack)
filterwarnings =
    ignore::DeprecationWarning
timeout = 300
minversion = 8.0
