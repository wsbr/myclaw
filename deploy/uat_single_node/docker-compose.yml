name: myclaw-uat-single-node

x-backend-build: &backend-build
  context: ../../backend
  dockerfile: Dockerfile
  labels:
    org.opencontainers.image.revision: ${MYCLAW_ACCEPTANCE_COMMIT_SHA:?clean SHA is required}
    io.myclaw.environment: uat_single_node

x-app-environment: &app-environment
  MYCLAW_ENVIRONMENT: production
  DATABASE_URL: ${DATABASE_URL}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
  REDIS_URL: ${REDIS_URL}
  SECRET_KEY: ${SECRET_KEY}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  DEBUG: "false"
  CORS_ORIGINS: ${CORS_ORIGINS}
  TRUSTED_SYNTHETIC_DNS_CIDRS: '${TRUSTED_SYNTHETIC_DNS_CIDRS:-["198.18.0.0/15"]}'
  INIT_ADMIN_EMAIL: ${INIT_ADMIN_EMAIL}
  INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD}
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-600}
  RATE_LIMIT_UNAUTHENTICATED_REQUESTS: ${RATE_LIMIT_UNAUTHENTICATED_REQUESTS:-60}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  RUNTIME_WORKER_POLL_SECONDS: ${RUNTIME_WORKER_POLL_SECONDS:-0.5}
  RUNTIME_WORKER_CONCURRENCY: ${RUNTIME_WORKER_CONCURRENCY:-8}
  RUNTIME_PROVIDER_POOL_MAX_ENTRIES: ${RUNTIME_PROVIDER_POOL_MAX_ENTRIES:-32}
  RUNTIME_OUTBOX_CLAIM_LEASE_SECONDS: ${RUNTIME_OUTBOX_CLAIM_LEASE_SECONDS:-30}
  RUNTIME_RUNNER_LEASE_SECONDS: ${RUNTIME_RUNNER_LEASE_SECONDS:-30}
  RUNTIME_RUNNER_HEARTBEAT_SECONDS: ${RUNTIME_RUNNER_HEARTBEAT_SECONDS:-10}
  SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-0.5}
  SCHEDULER_WORKER_CONCURRENCY: ${SCHEDULER_WORKER_CONCURRENCY:-4}
  SCHEDULER_CLAIM_LEASE_SECONDS: ${SCHEDULER_CLAIM_LEASE_SECONDS:-30}
  SANDBOX_WORKER_POLL_SECONDS: ${SANDBOX_WORKER_POLL_SECONDS:-0.5}
  SANDBOX_OUTBOX_CLAIM_LEASE_SECONDS: ${SANDBOX_OUTBOX_CLAIM_LEASE_SECONDS:-30}
  SANDBOX_ATTEMPT_STALE_SECONDS: ${SANDBOX_ATTEMPT_STALE_SECONDS:-60}
  SKILL_STORAGE_BACKEND: local
  SKILL_MANIFEST_MAX_BYTES: ${SKILL_MANIFEST_MAX_BYTES:-262144}
  SKILL_CATALOG_MAX_TOKENS: ${SKILL_CATALOG_MAX_TOKENS:-600}
  SKILL_SYNC_WORKER_POLL_SECONDS: ${SKILL_SYNC_WORKER_POLL_SECONDS:-1}
  SKILL_SYNC_CLAIM_LEASE_SECONDS: ${SKILL_SYNC_CLAIM_LEASE_SECONDS:-30}
  SKILL_SYNC_RECONCILE_SECONDS: ${SKILL_SYNC_RECONCILE_SECONDS:-3600}
  KNOWLEDGE_VECTOR_BACKEND: qdrant
  KNOWLEDGE_QDRANT_URL: http://qdrant:6333
  KNOWLEDGE_QDRANT_API_KEY: ${KNOWLEDGE_QDRANT_API_KEY:-}
  KNOWLEDGE_QDRANT_COLLECTION_PREFIX: ${KNOWLEDGE_QDRANT_COLLECTION_PREFIX:-myclaw_knowledge}
  KNOWLEDGE_WORKER_POLL_SECONDS: ${KNOWLEDGE_WORKER_POLL_SECONDS:-0.5}
  KNOWLEDGE_WORKER_CONCURRENCY: ${KNOWLEDGE_WORKER_CONCURRENCY:-2}
  KNOWLEDGE_INDEX_CLAIM_LEASE_SECONDS: ${KNOWLEDGE_INDEX_CLAIM_LEASE_SECONDS:-300}
  KNOWLEDGE_INDEX_HEARTBEAT_SECONDS: ${KNOWLEDGE_INDEX_HEARTBEAT_SECONDS:-30}
  KNOWLEDGE_EMBEDDING_TIMEOUT_SECONDS: ${KNOWLEDGE_EMBEDDING_TIMEOUT_SECONDS:-60}
  MAINTENANCE_POLL_SECONDS: ${MAINTENANCE_POLL_SECONDS:-3600}
  MAINTENANCE_COMMAND_POLL_SECONDS: ${MAINTENANCE_COMMAND_POLL_SECONDS:-1}
  MAINTENANCE_COMMAND_CLAIM_LEASE_SECONDS: ${MAINTENANCE_COMMAND_CLAIM_LEASE_SECONDS:-300}
  MAINTENANCE_COMMAND_HEARTBEAT_SECONDS: ${MAINTENANCE_COMMAND_HEARTBEAT_SECONDS:-30}
  MAINTENANCE_BATCH_SIZE: ${MAINTENANCE_BATCH_SIZE:-500}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  MYCLAW_RELEASE: ${MYCLAW_RELEASE:?release id is required}
  MYCLAW_ACCEPTANCE_COMMIT_SHA: ${MYCLAW_ACCEPTANCE_COMMIT_SHA}

x-backend-common: &backend-common
  build: *backend-build
  restart: unless-stopped
  user: "10001:10001"
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  volumes:
    - myclaw_data:/var/lib/myclaw

services:
  api:
    <<: *backend-common
    command: >
      sh -c '
        for attempt in $$(seq 1 30); do
          if alembic upgrade head; then
            exec uvicorn app.main:app --host 0.0.0.0 --port 8000;
          fi;
          echo "Migration attempt $$attempt failed; retrying in 2 seconds" >&2;
          sleep 2;
        done;
        echo "Database migrations failed after 30 attempts" >&2;
        exit 1
      '
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: myclaw-uat-single-node-api
    ports:
      - "${UAT_BIND_HOST:-127.0.0.1}:${UAT_API_PORT:-8201}:8000"
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${MYCLAW_ACCEPTANCE_COMMIT_SHA}
        io.myclaw.environment: uat_single_node
      args:
        VITE_API_BASE_URL: ${UAT_API_PUBLIC_URL:-http://localhost:8201}
    ports:
      - "${UAT_BIND_HOST:-127.0.0.1}:${UAT_UI_PORT:-8281}:80"
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  runtime-worker:
    <<: *backend-common
    command: python -m app.workers.runtime_worker
    deploy:
      replicas: 2
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: myclaw-uat-single-node-runtime-worker
    depends_on:
      api: {condition: service_healthy}

  scheduler-worker:
    <<: *backend-common
    command: python -m app.workers.scheduler_worker
    environment:
      <<: *app-environment
      DATABASE_POOL_SIZE: ${SCHEDULER_DATABASE_POOL_SIZE:-4}
      DATABASE_MAX_OVERFLOW: ${SCHEDULER_DATABASE_MAX_OVERFLOW:-4}
      OTEL_SERVICE_NAME: myclaw-uat-single-node-scheduler-worker
    depends_on:
      api: {condition: service_healthy}

  sandbox-worker:
    <<: *backend-common
    command: python -m app.workers.sandbox_worker
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: myclaw-uat-single-node-sandbox-worker
    depends_on:
      api: {condition: service_healthy}

  connector-worker:
    <<: *backend-common
    command: python -m app.workers.connector_worker
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: myclaw-uat-single-node-connector-worker
    depends_on:
      api: {condition: service_healthy}

  browser-worker:
    <<: *backend-common
    command: python -m app.workers.browser_worker
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: myclaw-uat-single-node-browser-worker
    depends_on:
      api: {condition: service_healthy}

  skill-sync-worker:
    <<: *backend-common
    command: python -m app.workers.skill_sync_worker
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: myclaw-uat-single-node-skill-sync-worker
    depends_on:
      api: {condition: service_healthy}

  knowledge-worker:
    <<: *backend-common
    command: python -m app.workers.knowledge_index_worker
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: myclaw-uat-single-node-knowledge-worker
    depends_on:
      api: {condition: service_healthy}
      qdrant: {condition: service_healthy}

  maintenance-worker:
    <<: *backend-common
    command: python -m app.workers.maintenance_worker
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: myclaw-uat-single-node-maintenance-worker
    depends_on:
      api: {condition: service_healthy}

  mysql:
    image: mysql:8.0
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${UAT_MYSQL_PORT:-3320}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${UAT_REDIS_PORT:-6400}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "127.0.0.1:${UAT_QDRANT_PORT:-6345}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  otel-volume-init:
    image: alpine:3.20
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["sh", "-c", "install -d -m 0750 /var/lib/myclaw/otel"]
    volumes:
      - myclaw_data:/var/lib/myclaw
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - myclaw_data:/var/lib/myclaw
    ports:
      - "127.0.0.1:${UAT_OTLP_PORT:-4330}:4318"
      - "127.0.0.1:${UAT_OTEL_HEALTH_PORT:-13145}:13133"
    depends_on:
      otel-volume-init: {condition: service_completed_successfully}
    restart: unless-stopped

volumes:
  mysql_data:
    external: true
    name: myclaw-uat-single-node-mysql-data
  redis_data:
    external: true
    name: myclaw-uat-single-node-redis-data
  myclaw_data:
    external: true
    name: myclaw-uat-single-node-app-data
  qdrant_data:
    external: true
    name: myclaw-uat-single-node-qdrant-data
