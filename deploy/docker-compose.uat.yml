name: myclaw-uat

x-backend-build: &backend-build
  context: ../backend
  dockerfile: Dockerfile
  labels:
    org.opencontainers.image.revision: ${MYCLAW_ACCEPTANCE_COMMIT_SHA:-unbound}

x-app-environment: &app-environment
  MYCLAW_ENVIRONMENT: production
  DATABASE_URL: ${DATABASE_URL}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
  REDIS_URL: ${REDIS_URL}
  SECRET_KEY: ${SECRET_KEY}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  DEBUG: "false"
  CORS_ORIGINS: ${CORS_ORIGINS}
  TRUSTED_SYNTHETIC_DNS_CIDRS: '${TRUSTED_SYNTHETIC_DNS_CIDRS:-["198.18.0.0/15"]}'
  INIT_ADMIN_EMAIL: ${INIT_ADMIN_EMAIL}
  INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-600}
  RATE_LIMIT_UNAUTHENTICATED_REQUESTS: ${RATE_LIMIT_UNAUTHENTICATED_REQUESTS:-60}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  RUNTIME_WORKER_POLL_SECONDS: ${RUNTIME_WORKER_POLL_SECONDS:-0.5}
  RUNTIME_OUTBOX_CLAIM_LEASE_SECONDS: ${RUNTIME_OUTBOX_CLAIM_LEASE_SECONDS:-30}
  RUNTIME_RUNNER_LEASE_SECONDS: ${RUNTIME_RUNNER_LEASE_SECONDS:-30}
  RUNTIME_RUNNER_HEARTBEAT_SECONDS: ${RUNTIME_RUNNER_HEARTBEAT_SECONDS:-10}
  SANDBOX_WORKER_POLL_SECONDS: ${SANDBOX_WORKER_POLL_SECONDS:-0.5}
  SANDBOX_OUTBOX_CLAIM_LEASE_SECONDS: ${SANDBOX_OUTBOX_CLAIM_LEASE_SECONDS:-30}
  SANDBOX_ATTEMPT_STALE_SECONDS: ${SANDBOX_ATTEMPT_STALE_SECONDS:-60}
  SKILL_STORAGE_BACKEND: local
  SKILL_MANIFEST_MAX_BYTES: ${SKILL_MANIFEST_MAX_BYTES:-262144}
  SKILL_CATALOG_MAX_TOKENS: ${SKILL_CATALOG_MAX_TOKENS:-600}
  SKILL_SYNC_WORKER_POLL_SECONDS: ${SKILL_SYNC_WORKER_POLL_SECONDS:-1}
  SKILL_SYNC_CLAIM_LEASE_SECONDS: ${SKILL_SYNC_CLAIM_LEASE_SECONDS:-30}
  SKILL_SYNC_RECONCILE_SECONDS: ${SKILL_SYNC_RECONCILE_SECONDS:-3600}
  MAINTENANCE_POLL_SECONDS: ${MAINTENANCE_POLL_SECONDS:-3600}
  MAINTENANCE_COMMAND_POLL_SECONDS: ${MAINTENANCE_COMMAND_POLL_SECONDS:-1}
  MAINTENANCE_COMMAND_CLAIM_LEASE_SECONDS: ${MAINTENANCE_COMMAND_CLAIM_LEASE_SECONDS:-300}
  MAINTENANCE_COMMAND_HEARTBEAT_SECONDS: ${MAINTENANCE_COMMAND_HEARTBEAT_SECONDS:-30}
  MAINTENANCE_BATCH_SIZE: ${MAINTENANCE_BATCH_SIZE:-500}
  OUTBOX_COMPLETED_RETENTION_DAYS: ${OUTBOX_COMPLETED_RETENTION_DAYS:-30}
  OUTBOX_DEAD_RETENTION_DAYS: ${OUTBOX_DEAD_RETENTION_DAYS:-180}
  CHECKPOINT_RETENTION_DAYS: ${CHECKPOINT_RETENTION_DAYS:-30}
  TRACE_RETENTION_DAYS: ${TRACE_RETENTION_DAYS:-30}
  DELIVERY_ATTEMPT_RETENTION_DAYS: ${DELIVERY_ATTEMPT_RETENTION_DAYS:-90}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  MYCLAW_RELEASE: ${MYCLAW_RELEASE:-uat-local}

x-backend-common: &backend-common
  build: *backend-build
  restart: unless-stopped
  user: "10001:10001"
  init: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  volumes:
    - myclaw_data:/var/lib/myclaw

services:
  api:
    <<: *backend-common
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: myclaw-uat-api
    ports:
      - "${UAT_BIND_HOST:-127.0.0.1}:${UAT_API_PORT:-8101}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${MYCLAW_ACCEPTANCE_COMMIT_SHA:-unbound}
      args:
        VITE_API_BASE_URL: ${UAT_API_PUBLIC_URL:-http://localhost:8101}
    ports:
      - "${UAT_BIND_HOST:-127.0.0.1}:${UAT_UI_PORT:-8181}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  runtime-worker:
    <<: *backend-common
    command: python -m app.workers.runtime_worker
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: myclaw-uat-runtime-worker
    depends_on:
      api:
        condition: service_healthy
    deploy:
      replicas: 2

  sandbox-worker:
    <<: *backend-common
    command: python -m app.workers.sandbox_worker
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: myclaw-uat-sandbox-worker
    depends_on:
      api:
        condition: service_healthy
    deploy:
      replicas: 2
    networks:
      - sandbox_internal

  connector-worker:
    <<: *backend-common
    command: python -m app.workers.connector_worker
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: myclaw-uat-connector-worker
    depends_on:
      api:
        condition: service_healthy

  browser-worker:
    <<: *backend-common
    command: python -m app.workers.browser_worker
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: myclaw-uat-browser-worker
    depends_on:
      api:
        condition: service_healthy

  skill-sync-worker:
    <<: *backend-common
    command: python -m app.workers.skill_sync_worker
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: myclaw-uat-skill-sync-worker
    depends_on:
      api:
        condition: service_healthy

  maintenance-worker:
    <<: *backend-common
    command: python -m app.workers.maintenance_worker
    environment:
      <<: *app-environment
      OTEL_SERVICE_NAME: myclaw-uat-maintenance-worker
    depends_on:
      api:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${UAT_MYSQL_PORT:-3310}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks:
      - default
      - sandbox_internal

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${UAT_REDIS_PORT:-6390}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  otel-volume-init:
    image: alpine:3.20
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command:
      - sh
      - -c
      - install -d -m 0750 /var/lib/myclaw/otel
    volumes:
      - myclaw_data:/var/lib/myclaw
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - myclaw_data:/var/lib/myclaw
    ports:
      - "127.0.0.1:${UAT_OTLP_PORT:-4320}:4318"
      - "127.0.0.1:${UAT_OTEL_HEALTH_PORT:-13135}:13133"
    depends_on:
      otel-volume-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - default
      - sandbox_internal

volumes:
  mysql_data:
    external: true
    name: myclaw-uat-mysql-data
  redis_data:
    external: true
    name: myclaw-uat-redis-data
  myclaw_data:
    external: true
    name: myclaw-uat-app-data

networks:
  sandbox_internal:
    internal: true
