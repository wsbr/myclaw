# 开发模式覆盖配置，仅在开发时使用：
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up
#
# 特性：
# - api/runtime-worker 挂载本地代码（热重载，无需重新 build 镜像）
# - 前端用 Vite dev server（端口 5173，支持 HMR）
#
# 注意：此文件不要在 docker compose up -d 时自动加载
#       生产/预览直接用 docker compose up -d 即可

services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    environment:
      - WATCHFILES_FORCE_POLLING=true

  runtime-worker:
    command: python -m app.workers.runtime_worker
    volumes:
      - ./backend:/app

  skill-sync-worker:
    volumes:
      - ./backend:/app

  maintenance-worker:
    volumes:
      - ./backend:/app

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "corepack enable && corepack prepare pnpm@10.15.0 --activate && pnpm install --frozen-lockfile && pnpm dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
