name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files and Git history
        run: ./scripts/check_repository_secrets.sh --history
      - name: Check patch whitespace
        run: git diff --check HEAD~1 HEAD || git diff --check
      - name: Validate Compose configuration
        env:
          MYCLAW_ENV_FILE: .env.example
        run: docker compose --env-file .env.example config --quiet

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            test/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt -r test/requirements.txt
      - name: Compile Python sources
        run: PYTHONPATH=backend python -m compileall -q backend/app test/unit/backend
      - name: Run deterministic unit tests
        run: PYTHONPATH=backend pytest -q test/unit/backend

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: frontend
        run: pnpm build
