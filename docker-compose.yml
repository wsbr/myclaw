x-backend-security: &backend-security
  user: "10001:10001"
  init: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  api:
    <<: *backend-security
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c '
        for attempt in $$(seq 1 30); do
          if alembic upgrade head; then
            exec uvicorn app.main:app --host 0.0.0.0 --port 8000;
          fi;
          echo "Migration attempt $$attempt failed; retrying in 2 seconds" >&2;
          sleep 2;
        done;
        echo "Database migrations failed after 30 attempts" >&2;
        exit 1
      '
    ports:
      - "${MYCLAW_API_PORT:-8000}:8000"
    env_file: ${MYCLAW_ENV_FILE:-.env}
    environment:
      - MYCLAW_ENVIRONMENT=${MYCLAW_ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-10}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-20}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DEBUG=${DEBUG:-false}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - TRUSTED_SYNTHETIC_DNS_CIDRS=${TRUSTED_SYNTHETIC_DNS_CIDRS:-[]}
      - INIT_ADMIN_EMAIL=${INIT_ADMIN_EMAIL}
      - INIT_ADMIN_PASSWORD=${INIT_ADMIN_PASSWORD}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-600}
      - RATE_LIMIT_UNAUTHENTICATED_REQUESTS=${RATE_LIMIT_UNAUTHENTICATED_REQUESTS:-60}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - OTEL_SERVICE_NAME=myclaw-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - MYCLAW_RELEASE=${MYCLAW_RELEASE:-development}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    volumes:
      - myclaw_data:/var/lib/myclaw

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${MYCLAW_UI_PORT:-8080}:80"
    restart: unless-stopped

  runtime-worker:
    <<: *backend-security
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.workers.runtime_worker
    env_file: ${MYCLAW_ENV_FILE:-.env}
    environment:
      - MYCLAW_ENVIRONMENT=${MYCLAW_ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-10}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-20}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - RUNTIME_WORKER_POLL_SECONDS=${RUNTIME_WORKER_POLL_SECONDS:-0.5}
      - RUNTIME_WORKER_CONCURRENCY=${RUNTIME_WORKER_CONCURRENCY:-8}
      - RUNTIME_PROVIDER_POOL_MAX_ENTRIES=${RUNTIME_PROVIDER_POOL_MAX_ENTRIES:-32}
      - RUNTIME_OUTBOX_CLAIM_LEASE_SECONDS=${RUNTIME_OUTBOX_CLAIM_LEASE_SECONDS:-30}
      - RUNTIME_RUNNER_LEASE_SECONDS=${RUNTIME_RUNNER_LEASE_SECONDS:-30}
      - RUNTIME_RUNNER_HEARTBEAT_SECONDS=${RUNTIME_RUNNER_HEARTBEAT_SECONDS:-10}
      - OTEL_SERVICE_NAME=myclaw-runtime-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - MYCLAW_RELEASE=${MYCLAW_RELEASE:-development}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - myclaw_data:/var/lib/myclaw

  scheduler-worker:
    <<: *backend-security
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.workers.scheduler_worker
    env_file: ${MYCLAW_ENV_FILE:-.env}
    environment:
      - MYCLAW_ENVIRONMENT=${MYCLAW_ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_POOL_SIZE=${SCHEDULER_DATABASE_POOL_SIZE:-4}
      - DATABASE_MAX_OVERFLOW=${SCHEDULER_DATABASE_MAX_OVERFLOW:-4}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SCHEDULER_POLL_SECONDS=${SCHEDULER_POLL_SECONDS:-0.5}
      - SCHEDULER_WORKER_CONCURRENCY=${SCHEDULER_WORKER_CONCURRENCY:-4}
      - SCHEDULER_CLAIM_LEASE_SECONDS=${SCHEDULER_CLAIM_LEASE_SECONDS:-30}
      - OTEL_SERVICE_NAME=myclaw-scheduler-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - MYCLAW_RELEASE=${MYCLAW_RELEASE:-development}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - myclaw_data:/var/lib/myclaw

  knowledge-worker:
    <<: *backend-security
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.workers.knowledge_index_worker
    env_file: ${MYCLAW_ENV_FILE:-.env}
    environment:
      - MYCLAW_ENVIRONMENT=${MYCLAW_ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-4}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-4}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - KNOWLEDGE_VECTOR_BACKEND=qdrant
      - KNOWLEDGE_QDRANT_URL=http://qdrant:6333
      - KNOWLEDGE_QDRANT_API_KEY=${KNOWLEDGE_QDRANT_API_KEY:-}
      - KNOWLEDGE_QDRANT_COLLECTION_PREFIX=${KNOWLEDGE_QDRANT_COLLECTION_PREFIX:-myclaw_knowledge}
      - KNOWLEDGE_WORKER_POLL_SECONDS=${KNOWLEDGE_WORKER_POLL_SECONDS:-0.5}
      - KNOWLEDGE_WORKER_CONCURRENCY=${KNOWLEDGE_WORKER_CONCURRENCY:-2}
      - KNOWLEDGE_INDEX_CLAIM_LEASE_SECONDS=${KNOWLEDGE_INDEX_CLAIM_LEASE_SECONDS:-300}
      - KNOWLEDGE_INDEX_HEARTBEAT_SECONDS=${KNOWLEDGE_INDEX_HEARTBEAT_SECONDS:-30}
      - KNOWLEDGE_EMBEDDING_TIMEOUT_SECONDS=${KNOWLEDGE_EMBEDDING_TIMEOUT_SECONDS:-60}
      - OTEL_SERVICE_NAME=myclaw-knowledge-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - MYCLAW_RELEASE=${MYCLAW_RELEASE:-development}
    depends_on:
      api:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - myclaw_data:/var/lib/myclaw

  delivery-worker:
    <<: *backend-security
    profiles: ["channel"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.workers.channel_delivery_worker
    env_file: ${MYCLAW_ENV_FILE:-.env}
    environment:
      - MYCLAW_ENVIRONMENT=${MYCLAW_ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-10}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-20}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - OTEL_SERVICE_NAME=myclaw-delivery-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - MYCLAW_RELEASE=${MYCLAW_RELEASE:-development}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  sandbox-worker:
    <<: *backend-security
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.workers.sandbox_worker
    env_file: ${MYCLAW_ENV_FILE:-.env}
    environment:
      - MYCLAW_ENVIRONMENT=${MYCLAW_ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-10}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-20}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SANDBOX_WORKER_POLL_SECONDS=${SANDBOX_WORKER_POLL_SECONDS:-0.5}
      - SANDBOX_OUTBOX_CLAIM_LEASE_SECONDS=${SANDBOX_OUTBOX_CLAIM_LEASE_SECONDS:-30}
      - SANDBOX_ATTEMPT_STALE_SECONDS=${SANDBOX_ATTEMPT_STALE_SECONDS:-60}
      - OTEL_SERVICE_NAME=myclaw-sandbox-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - MYCLAW_RELEASE=${MYCLAW_RELEASE:-development}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - myclaw_data:/var/lib/myclaw
    networks:
      - sandbox_internal

  connector-worker:
    <<: *backend-security
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.workers.connector_worker
    env_file: ${MYCLAW_ENV_FILE:-.env}
    environment:
      - MYCLAW_ENVIRONMENT=${MYCLAW_ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-6}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-6}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SANDBOX_WORKER_POLL_SECONDS=${SANDBOX_WORKER_POLL_SECONDS:-0.5}
      - SANDBOX_OUTBOX_CLAIM_LEASE_SECONDS=${SANDBOX_OUTBOX_CLAIM_LEASE_SECONDS:-30}
      - SANDBOX_ATTEMPT_STALE_SECONDS=${SANDBOX_ATTEMPT_STALE_SECONDS:-60}
      - OTEL_SERVICE_NAME=myclaw-connector-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - MYCLAW_RELEASE=${MYCLAW_RELEASE:-development}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - myclaw_data:/var/lib/myclaw

  browser-worker:
    <<: *backend-security
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.workers.browser_worker
    env_file: ${MYCLAW_ENV_FILE:-.env}
    environment:
      - MYCLAW_ENVIRONMENT=${MYCLAW_ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-6}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-6}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SANDBOX_WORKER_POLL_SECONDS=${SANDBOX_WORKER_POLL_SECONDS:-0.5}
      - SANDBOX_OUTBOX_CLAIM_LEASE_SECONDS=${SANDBOX_OUTBOX_CLAIM_LEASE_SECONDS:-30}
      - SANDBOX_ATTEMPT_STALE_SECONDS=${SANDBOX_ATTEMPT_STALE_SECONDS:-60}
      - OTEL_SERVICE_NAME=myclaw-browser-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - MYCLAW_RELEASE=${MYCLAW_RELEASE:-development}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - myclaw_data:/var/lib/myclaw

  skill-sync-worker:
    <<: *backend-security
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.workers.skill_sync_worker
    env_file: ${MYCLAW_ENV_FILE:-.env}
    environment:
      - MYCLAW_ENVIRONMENT=${MYCLAW_ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-4}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-4}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SKILL_SYNC_WORKER_POLL_SECONDS=${SKILL_SYNC_WORKER_POLL_SECONDS:-1}
      - SKILL_SYNC_CLAIM_LEASE_SECONDS=${SKILL_SYNC_CLAIM_LEASE_SECONDS:-30}
      - SKILL_SYNC_RECONCILE_SECONDS=${SKILL_SYNC_RECONCILE_SECONDS:-3600}
      - OTEL_SERVICE_NAME=myclaw-skill-sync-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - MYCLAW_RELEASE=${MYCLAW_RELEASE:-development}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - myclaw_data:/var/lib/myclaw

  maintenance-worker:
    <<: *backend-security
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.workers.maintenance_worker
    env_file: ${MYCLAW_ENV_FILE:-.env}
    environment:
      - MYCLAW_ENVIRONMENT=${MYCLAW_ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-4}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-4}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - MAINTENANCE_POLL_SECONDS=${MAINTENANCE_POLL_SECONDS:-3600}
      - MAINTENANCE_COMMAND_POLL_SECONDS=${MAINTENANCE_COMMAND_POLL_SECONDS:-1}
      - MAINTENANCE_COMMAND_CLAIM_LEASE_SECONDS=${MAINTENANCE_COMMAND_CLAIM_LEASE_SECONDS:-300}
      - MAINTENANCE_COMMAND_HEARTBEAT_SECONDS=${MAINTENANCE_COMMAND_HEARTBEAT_SECONDS:-30}
      - MAINTENANCE_BATCH_SIZE=${MAINTENANCE_BATCH_SIZE:-500}
      - OUTBOX_COMPLETED_RETENTION_DAYS=${OUTBOX_COMPLETED_RETENTION_DAYS:-30}
      - OUTBOX_DEAD_RETENTION_DAYS=${OUTBOX_DEAD_RETENTION_DAYS:-180}
      - CHECKPOINT_RETENTION_DAYS=${CHECKPOINT_RETENTION_DAYS:-30}
      - TRACE_RETENTION_DAYS=${TRACE_RETENTION_DAYS:-30}
      - DELIVERY_ATTEMPT_RETENTION_DAYS=${DELIVERY_ATTEMPT_RETENTION_DAYS:-90}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYCLAW_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks:
      - default
      - sandbox_internal

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "${MYCLAW_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "${MYCLAW_QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    profiles: ["observability"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4318:4318"
      - "13133:13133"
    restart: unless-stopped
    networks:
      - default
      - sandbox_internal

volumes:
  mysql_data:
  redis_data:
  myclaw_data:
  qdrant_data:

networks:
  sandbox_internal:
    internal: true
